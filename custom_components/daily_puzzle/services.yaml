submit_word:
  name: Submit word
  description: Submit a five-letter guess for today's Word Grid.
  fields:
    guess:
      name: Guess
      required: true
      example: CRANE
      selector:
        text:

submit_group:
  name: Submit group
  description: Submit four selected words for today's Four of a Kind.
  fields:
    words:
      name: Words
      required: true
      selector:
        object:

replay:
  name: Replay today's puzzle
  description: Reset the playable board for today without changing completion status, streaks, or totals.

admin_reset:
  name: Reset test game
  description: Reset the current game when Admin/Test Mode is enabled.

admin_switch_game:
  name: Switch test game
  description: Switch to another game type for testing without affecting daily statistics.
  fields:
    game:
      name: Game
      required: true
      selector:
        select:
          options:
            - label: Word Grid
              value: word_grid
            - label: Four of a Kind
              value: four_of_a_kind

return_to_daily:
  name: Return to daily puzzle
  description: Leave the test session and restore today's configured daily game.

use_hint:
  name: Use hint
  description: Reveal the next available hint for the current puzzle when hints are enabled.

submit_weave:
  name: Submit Word Weave path
  description: Submit a connected path of grid cells for the current Word Weave puzzle.
  fields:
    path:
      required: true
      selector:
        object:
